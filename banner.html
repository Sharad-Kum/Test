<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Banner — Sharad Kumar</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1200px;
        height: 627px;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
        background: #050d14;
    }

    .banner {
        width: 1200px;
        height: 627px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(ellipse at 30% 40%, #0d2840 0%, #071520 40%, #050d14 100%);
    }

    /* Subtle geometric background lines */
    .banner::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(212, 175, 55, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
        background-size: 60px 60px;
    }

    /* Gold accent line left */
    .accent-left {
        position: absolute;
        left: 0;
        top: 0;
        width: 6px;
        height: 100%;
        background: linear-gradient(to bottom, transparent, #d4af37, #d4af37, transparent);
    }

    /* Gold accent line right */
    .accent-right {
        position: absolute;
        right: 0;
        top: 0;
        width: 6px;
        height: 100%;
        background: linear-gradient(to bottom, transparent, #d4af37, #d4af37, transparent);
    }

    /* Top gold line */
    .accent-top {
        position: absolute;
        top: 0;
        left: 6px;
        right: 6px;
        height: 2px;
        background: linear-gradient(to right, transparent, #d4af37 20%, #d4af37 80%, transparent);
        opacity: 0.6;
    }

    /* Bottom gold line */
    .accent-bottom {
        position: absolute;
        bottom: 0;
        left: 6px;
        right: 6px;
        height: 2px;
        background: linear-gradient(to right, transparent, #d4af37 20%, #d4af37 80%, transparent);
        opacity: 0.6;
    }

    /* Glow orb */
    .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .content {
        position: relative;
        text-align: center;
        z-index: 2;
        padding: 0 80px;
    }

    .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: rgba(212, 175, 55, 0.7);
        margin-bottom: 24px;
    }

    .name {
        font-size: 72px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #f0f0f0;
        line-height: 1;
        margin-bottom: 20px;
        text-shadow: 0 2px 40px rgba(212, 175, 55, 0.15);
    }

    .divider {
        width: 120px;
        height: 2px;
        background: linear-gradient(to right, transparent, #d4af37, transparent);
        margin: 0 auto 20px auto;
    }

    .tagline {
        font-size: 18px;
        font-weight: 400;
        color: #d4af37;
        letter-spacing: 1px;
        line-height: 1.5;
        margin-bottom: 32px;
    }

    .pills {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(212, 175, 55, 0.8);
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(212, 175, 55, 0.06);
    min-width: 140px;
    text-align: center;
}

    .url {
        position: absolute;
        bottom: 28px;
        right: 40px;
        font-size: 13px;
        color: rgba(212, 175, 55, 0.5);
        letter-spacing: 1px;
        z-index: 2;
    }
</style>
</head>
<body>
<div class="banner">
    <div class="accent-left"></div>
    <div class="accent-right"></div>
    <div class="accent-top"></div>
    <div class="accent-bottom"></div>
    <div class="glow"></div>

    <div class="content">
        <div class="name">SHARAD KUMAR</div>
        <div class="divider"></div>
        <div class="tagline">Operating at the intersection of Markets, Technology and Delivery</div>
        <div class="pills">
            <div class="pill">GTM & Growth</div>
            <div class="pill">Solution</div>
            <div class="pill">Delivery</div>
        </div>
    </div>

    <div class="url">sharad-kum.github.io</div>
</div>
</body>
</html>
